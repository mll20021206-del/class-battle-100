<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>你画我猜</title><link rel="stylesheet" href="style.css"></head><body><div class="phone"><section id="joinView" class="card"><h1>🎨 你画我猜</h1><input id="name" placeholder="输入昵称" maxlength="12"><button id="joinBtn" class="primary">加入游戏</button><p id="joinMsg"></p></section><section id="waitView" class="card" hidden><h2>加入成功</h2><p>等待老师开始…</p></section><section id="roundView" class="card" hidden><div class="top"><b id="mRound"></b><span id="mTimer">60</span></div><div id="drawerPanel" hidden><h2>你是画手，请画：<span id="secretWord"></span></h2><canvas id="drawCanvas" width="700" height="700"></canvas><button id="clearBtn">清空</button></div><div id="guessPanel" hidden><h3>画手：<span id="mDrawer"></span></h3><canvas id="watchCanvas" width="700" height="700"></canvas><input id="guessInput" placeholder="输入你的答案"><button id="guessBtn" class="primary">提交</button><p id="guessMsg"></p></div><div id="roundEnd"></div></section><section id="finishView" class="card" hidden><h1>🏆 游戏结束</h1><div id="myResult"></div><div id="mobileRank"></div></section></div><script src="/socket.io/socket.io.js"></script><script src="player.js"></script></body></html>
